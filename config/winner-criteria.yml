# Winner criteria for the /winner-crawl pipeline.
# The skill reads this file at the start of every run.

# Meta ad account to crawl. USD, business "thehoolest".
ad_account_id: "948100899908170"
ad_account_name: "Hoolest FB Ads"

# --- The bar ---------------------------------------------------------------
# Both must be met, measured AT AD LEVEL (one hook variant), not campaign.
# Lowered from 1000 to 500 by Mark 2026-08-29, at the same time the window
# narrowed to 14 days. Halving the window without halving the floor had roughly
# doubled the strictness -- at $1,000/14d nothing in the account qualified. This
# restores about the 30-day pass rate while keeping the fresher signal.
min_spend_usd: 500
min_roas: 1.8

# Rolling window the metrics are measured over. Narrowed to 14 days by Mark
# 2026-08-29 (was last_30d). Tighter window = fresher signal: a creative has to
# be earning NOW, not coasting on spend from three weeks ago. The trade-off is
# fewer ads clear the $1,000 floor in 14 days, so expect leaner weeks and watch
# the near-miss list, where spend-short/ROAS-strong creatives now collect.
date_preset: last_14d

# --- Notion destination ----------------------------------------------------
video_brief_data_source: "collection://34b8fb5b-44b0-8029-8b87-000b98d7a19f"
performance_value: "Winner"

# Only ever PROMOTE. Never write "Loser", never overwrite a Performance value
# a human already set. The crawl can add signal, never erase judgement.
promote_only: true

# Also record which hook variant cleared the bar, in the existing
# "Winning version" text property (HPT025 already uses it this way).
write_winning_version: true

# --- Scope -----------------------------------------------------------------
# VIDEO ONLY. Confirmed by Mark 2026-08-29: an ad name carrying a VID token is
# a video, and video is the whole scope for now. Ads without a VID token --
# statics (IMG) and creator/whitelist ads, which follow no naming convention --
# are OUT OF SCOPE. They are not winners-without-a-row; they are not evaluated.
#
# This is also what keeps writes correct. Statics reuse the SAME HPT numbers for
# completely different concepts, so a number-only match writes to the wrong row.
# See "Video only, and why that also keeps writes correct" in SKILL.md.
scope_format_token: VID
require_concept_name_match: true

# Minimum token-overlap between the Meta ad's concept slug and the Notion
# "Concept Name" before a match is accepted. Below this, report, do not write.
concept_match_min_overlap: 0.5
