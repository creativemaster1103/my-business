# Competitor ad watchlist for the /competitor-ad-swipe pipeline.
# Edit freely — the skill reads this file at the start of every run.

# An ad must have been running at least this many days to be considered.
# Longevity is our proxy for profitability: nobody funds a losing creative for a month.
min_days_running: 30

# Ceiling on new Notion briefs per run, never a target. Filing to hit this number
# is how the library fills with near-copies.
max_new_briefs_per_run: 3

# Never file two briefs from the same competitor in one sweep.
max_briefs_per_competitor_per_run: 1

# TrendTrack favorites folders holding state between runs.
# Both are PERSONAL scope (Mark's own favorites) — pass scope: "personal" on every call.
# Keep them private; never share or make them organization-visible.
# Queue of vetted candidates waiting to be briefed. Picks come from here first.
inspo_bank_folder_id: 6985225d-84f3-4e72-b831-96938ac00b9a
inspo_bank_folder_name: "Inspo Bank → To Remake"
inspo_bank_target_size: 12

# Already briefed. Never swipe these again.
swiped_ledger_folder_id: a608a57a-d8fc-47cb-87a6-f3d1b08076b1
swiped_ledger_folder_name: "Swiped → VeRelief Briefs"

# Skip a candidate whose framework appears in the last N briefs' Content Type.
framework_lookback: 10

# Avatars currently under-served in the Video Brief library. Prefer these when
# candidates are otherwise close. Re-check the live counts each run rather than
# trusting this list.
prefer_avatars:
  - HRV Hunter
  - Sleep Struggler
  - Off-ramper

# Only consider ads this old at most, so we mine current winners rather than
# long-running evergreen ads the team already swiped a year ago.
max_days_running: 365

