# Angles that never transfer to a $399 non-prescription wellness device.
# The skill drops any swiped ad whose primary angle matches one of these.
excluded_angles:
  - Prescription or medication replacement
  - Named-condition treatment claims
  - Ingestible dosing / supplement routine
  - Subscription-only offer mechanics

