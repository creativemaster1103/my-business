# Config for the /ugc-scripting pipeline.
# Edit freely — the skill reads this file at the start of every run.

# EVERY BRIEF SHIPS: 2 scripts + 10 general clips, on one page.
#
# Both scripts live on the same brief page, in the `Script 1` / `Script 2`
# sections the Notion template already carries. 2 scripts x 5 hooks = 10 hook
# takes + 2 body takes, plus one shotlist of 10 clips serving both.
scripts_per_brief: 2
hooks_per_script: 5
general_clips_per_brief: 10

# The Notion template's standing naming block says THREE hooks. That number is
# now wrong — correct it to five on every brief. A brief asking for three while
# five are written is how a creator delivers the wrong number of takes.
# (The Video Brief / AI-VO pipeline uses four. Three separate conventions is
# one too many; raise it with Mark.)
correct_template_hook_count_to: 5

# Five genuinely different mechanisms, not five rewordings. A reworded hook
# tests nothing. Pick five of these eight per script.
hook_mechanisms:
  - in_medias_res        # mid-sentence, mid-action, already using it
  - direct_callout       # names the viewer's situation in the first four words
  - objection_first      # leads with the reason not to buy, then dismantles it
  - reframe              # says the thing the category never says out loud
  - confession           # admits something slightly unflattering
  - demonstration_first  # does the thing on camera before saying anything
  - contrast             # "everyone says X" -> the actual answer
  - failed_alternative   # opens on the thing that did not work, in frame

# So the ten hooks across the page stay varied rather than converging.
max_shared_hook_mechanisms_between_scripts: 2

# The two scripts must be genuinely different, not two angles on one idea.
enforce_distinct_framework_within_brief: true
enforce_distinct_persona_angle_within_brief: true

# Never relaxed automatically. Dropping any of these is lowering the bar.
never_relax_without_approval:
  - four gates cleared before writing
  - five distinct hook mechanisms per script
  - every clip shootable alone on an iPhone
  - brand compliance gate
  - endorsement gate
  - two distinct scripts per brief
  - ten general clips per brief
  - customer-sourced — no invented quotes

# --- Connector holds -------------------------------------------------------
# Shopify is ON HOLD. Standing instruction from Mark, 2026-09-16.
# Do not connect to or query Shopify from this pipeline — not for price, not
# for offers, not for product status. This is a hold, not a removal: lift it
# only when Mark says so.
connector_holds:
  shopify:
    status: on_hold
    since: 2026-09-16
    set_by: Mark
    scope: All queries — price, offer, product status
    consequences:
      offer_value: Take from the user, or leave the Notion template's default
      price_in_scripts: None. Ask Mark for a figure if one is genuinely needed
      never: Infer a discount from an order value or reuse a stale number from this repo

# --- Brief mode ------------------------------------------------------------
# ASK FIRST, before the gates and before the research. Never inferred, never
# defaulted — it decides which personas are even available to the script.
ask_brief_mode_first: true
brief_modes:
  creator:   # for a named content creator
    title_format: "<Creator Name>-<Concept>"
    content_creator_cell: "<Creator Name>"
    persona: Constrained — must be one this creator can carry without acting
    confirm_genuine_use: true    # ask. gifted is not used
    clips: Staged in the creator's actual space
  general:   # not yet assigned to anyone
    title_format: "General-<Concept>"
    content_creator_cell: "General — unassigned · cast: <one-line spec>"
    persona: Free — chosen on the evidence, then the casting is specified
    mark_all_personal_outcome_lines: "[REQUIRES GENUINE USE]"
    clips: Location-agnostic — anyone must be able to shoot them

# `General-` is a new convention; every existing brief is creator-named.
# Flag it to Mark the first time one is filed.
general_title_prefix_is_new_convention: true

# A general brief with no casting spec is unfinished — nobody downstream
# knows who to book.
general_brief_requires_casting_spec: true

# --- The four gates --------------------------------------------------------
# BLOCKING. Nothing is written until all four are resolved, per script.
# Full procedure in references/four-gates.md.
gates:
  - persona          # from the live `Official Persona` toggle on Notion
  - awareness_level  # Unaware -> Most-Aware
  - core_desire      # one of the Life Force 8
  - ad_angle         # optional to be GIVEN — derive from pain/desire/fear and say so

# Read live every run. It is maintained and carries real survey percentages;
# a copy in this repo would go stale silently.
persona_source_page: 3448fb5b-44b0-80fe-88e0-d1e8064822fc   # 👤 Buying Persona
persona_toggle: Official Persona

# The same page's `Final and approved personas` toggle holds these four:
# "the current approved set. Use these for creative that is locked."
approved_personas:
  - The Wired Lifer
  - The Lights-Out Loser
  - The HRV Hunter
  - The Off-Ramper

# Legitimate personas, but ask Mark before shipping a script against one.
personas_needing_signoff:
  - The Self-Rescuer
  - The Chronic Condition Warrior
  - The Clinician / Practitioner
  - The Gift / Caregiver Buyer

# Standing compliance callout on the persona page itself. This persona is
# DRAWN to anti-medication framing, which is precisely where the legal risk
# sits — the appeal and the exposure are the same sentence.
persona_compliance_holds:
  The Off-Ramper:
    body_state_language_only: true
    signoff_required_from: Nick
    never: Anti-medication framing in paid

# Angles that never transfer to this product, whoever the persona is.
# Shared with the swipe pipeline — see config/competitors.yml excluded_angles.
excluded_angles_source: config/competitors.yml

# --- Voice of customer -----------------------------------------------------
# Minimum usable quotes in the bank before writing starts. Below this the run
# stops and reports, rather than writing an AI-VO script and calling it UGC.
min_quotes_in_bank: 15

# Prefer material several independent customers circle. One striking review is
# an anecdote; three saying the same thing is an insight.
min_independent_voices_per_script: 3

# Read these first. 5-star reviews are congratulation, not information.
review_star_priority: [3, 4, 2, 5, 1]

# NOTE: Shopify is deliberately absent from this list — see connector_holds.
voc_sources:
  - okendo_reviews          # reviews_search / reviews_aggregate
  - parker_reviews_semantic # search_customer_reviews_semantic
  - post_purchase_survey    # semantic_search_post_purchase_survey — the trigger moment
  - ad_comments             # search_facebook_ad_comments_semantic — public objections
  - gorgias_tickets         # optional — private objections

# --- Framework selection ---------------------------------------------------
# The 25-framework library lives in the `ugc-video-frameworks` skill. Do not
# duplicate it here and do not invent a 26th.
frameworks_skill: ugc-video-frameworks
framework_lookback: 12

# --- Notion destination ----------------------------------------------------
# A PAGE of child pages, not a database. No properties, no HPT creative ID,
# no naming-convention spreadsheet. Do not file UGC scripts in the Video Brief
# database — that is the AI-VO pipeline's destination.
ugc_brief_database_page: 3448fb5b-44b0-80b7-a01f-df29eb7dd956   # 🤳 UGC Brief Database
template_page: 3dc8fb5b-44b0-8025-920d-cdc4e9ac0903             # ✏️ TEMPLATE
page_icon: ✏️
page_title_format: "<Creator Name>-<Concept>"

# The template and all four live briefs say `Hoolest Mini`. Confirm the product
# before filing rather than assuming VeRelief Prime.
confirm_product_before_filing: true

# Creator-facing file naming. The template's example is `Talkinghead_hook1`,
# which is ambiguous once a page carries two scripts — scope it to the script.
file_naming:
  a_roll_hook: "Talkinghead_S<script>_hook<n>"   # n = 1..5
  a_roll_body: "Talkinghead_S<script>_body"
  b_roll: "BRoll_<section>"                      # 10 of them

# --- The 10 general clips --------------------------------------------------
# ONE PERSON, ONE IPHONE, NO CREW. The creators are not running a production
# shoot — they have a phone, the room they live in, and about fifteen minutes.
# A clip they cannot execute alone comes back missing, and nobody finds out
# until the edit.
#
# The test: could they shoot it, alone, in their kitchen, in under a minute,
# without moving furniture or asking anyone for help?
clip_execution_rules:
  crew: None. One person, one iPhone
  never_required: [second camera operator, second phone, tripod, gimbal, lighting kit, macro lens]
  props: Only the device, the gel tips, and things already in their home
  take: One continuous take, no choreography, no timing to hit
  editing: None. Raw clips, no filters, no colour grading, no speed ramps
  screens: Never a phone screen — they are filming WITH the phone. Laptop, TV or wall calendar
  phone_position_must_be_stated: true   # handheld, or propped against books/a mug/a wall

# One per B-ROLLS | SHOTLIST row. The template ships 8 rows; extend to 10.
# The test for "general" is that BOTH scripts can use it — a clip serving only
# one is script b-roll and does not count toward the ten.
#
# `section` is what the creator names the file after (BRoll_Struggle), so it
# goes in bold at the front of the Visual description cell. `clip` is written
# as an instruction in the second person, because that is what gets pasted in.
# Full spec in references/general-clips.md.
general_clips:
  - {n: 1,  section: Device,       phone: handheld, cuts_in: hook, clip: "Hold the device in one hand over a plain table. Turn it over slowly once"}
  - {n: 2,  section: Application,  phone: propped,  cuts_in: body, clip: "Prop the phone. Use the device the way you normally do. Face out of frame"}
  - {n: 3,  section: Struggle,     phone: propped,  cuts_in: hook, clip: "Prop the phone at your desk. Sit how you actually sit at 4pm. Do nothing for 8 seconds"}
  - {n: 4,  section: Relief,       phone: propped,  cuts_in: body, clip: "Same setup as Struggle. Let one long breath out and let your shoulders drop"}
  - {n: 5,  section: Alternatives, phone: handheld, cuts_in: body, clip: "Point the phone at what you tried before — cold tea, a wine glass, an app open on a laptop"}
  - {n: 6,  section: Portability,  phone: handheld, cuts_in: body, clip: "Bag on the table. Reach in with one hand and pull the device out. One motion"}
  - {n: 7,  section: Trigger,      phone: handheld, cuts_in: hook, clip: "Film a laptop screen, TV or wall calendar — a packed week, a full inbox, a clock at 3am"}
  - {n: 8,  section: Gel tip,      phone: handheld, cuts_in: body, clip: "Hold a gel tip as close to the lens as the phone will still focus. Turn it slightly"}
  - {n: 9,  section: Everyday,     phone: propped,  cuts_in: any,  clip: "Prop the phone. Film your hands doing something ordinary — typing, making tea, phone face-down"}
  - {n: 10, section: Aftermath,    phone: propped,  cuts_in: cta,  clip: "Prop the phone. Walk back to the desk or get into bed, settled, and carry on. No device in frame"}

general_clip_must_serve_both_scripts: true
hold_each_clip_seconds: [6, 8]

# Do not ask for a wide AND a close of everything — that doubles a fifteen
# minute job and the second version rarely gets used.
takes_per_clip: 1

# --- Creator shoot defaults ------------------------------------------------
# The brief's own standing `Shooting Specifications` callout governs the
# technical side (good lighting, 9:16, no filters, 1-3s handles, no logos).
# These cover casting, energy and register, which the callout does not — and
# they must never contradict it.
shoot_defaults:
  camera: Front-facing phone, hand-held
  framing: Chest-up, slightly off-centre
  location: The room where the problem actually happens
  wardrobe: Own clothes, nothing styled, no logos
  energy: Low and flat. Talking, not presenting
  takes_per_hook: 1

target_length_seconds: [30, 45]
hook_must_land_within_seconds: 3

# Any paid or gifted creator discloses in the first two seconds, as a super.
# Not in the caption, not at the end.
disclosure_super: "#ad"
disclosure_within_seconds: 2
